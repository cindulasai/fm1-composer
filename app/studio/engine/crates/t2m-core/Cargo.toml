[package]
name = "t2m-core"
description = "text2midi v2 vocabulary: pitch, time, tonal systems, briefs, knowledge base, scores"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
include_dir = "0.7.4"
ron = "0.12.3"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: a brief read back from JSON must equal the one written, bit for bit.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
strsim = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"
serde_json = "1.0.154"
