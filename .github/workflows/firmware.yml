# Build COMPOSER's .fwsc with JieLi's toolchain (Linux x86-64 only) and run the gate. The package is an artifact;
# a local run downloads it (gh run download) to test it in fm1-emu. No release. COMPOSER Studio goes to GitHub Pages
# only from main, after a green gate, and only once the repo is public (decision 42; private: the pages job is skipped).
name: firmware
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python packages
        run: python3 -m pip install -r app/tools/requirements.txt
      - name: JieLi toolchain
        run: sh app/tools/get_toolchain.sh
      - name: JieLi AC79 SDK (three files of it go into the package)
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK; sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
      - name: Build the FM-1 package
        run: sh app/build.sh
      - name: fm1-emu (the gate runs the new package in it)
        run: sh app/tools/get_emu.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            app/studio/engine/target
          key: studio-${{ runner.os }}-wbg0.2.130-${{ hashFiles('app/studio/engine/Cargo.lock') }}
      - name: Rust for COMPOSER Studio's engine (wasm32 target, wasm-bindgen 0.2.130)
        run: |
          rustup target add wasm32-unknown-unknown
          command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: fm1-emu's browser build (Studio's page runs the new package in it)
        run: sh app/tools/get_web_emu.sh
      - name: Headless Chromium for Studio's browser tests
        run: python3 -m playwright install --with-deps chromium-headless-shell
      - name: Gate
        run: PY=python3 sh app/check.sh
      - name: COMPOSER Studio's export, tested in a browser (27.1; a missing piece fails here, never skips)
        if: github.ref == 'refs/heads/main' && !github.event.repository.private
        run: cd app && FM1_REQUIRE_STUDIO=1 python3 -m pytest -q -rs -p no:cacheprovider tools/tests/test_export.py -k test_27_1
      - name: COMPOSER Studio as a static site
        if: github.ref == 'refs/heads/main' && !github.event.repository.private
        run: app/fm1c studio --export _site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && !github.event.repository.private
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        if: always()        # (a red gate still fails the run; the package is kept to look into it)
        with:
          name: composer-fwsc
          path: |
            app/build/composer.fwsc
            app/build/composer.dis
          if-no-files-found: error
  pages:
    needs: build
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
